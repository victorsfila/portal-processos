<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<title>Acompanhamento de Processos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,600;112,800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#0e0e0e);--ink:light-dark(#111,#f2f2f2);--mut:light-dark(#6b6b6b,#9a9a9a);--line:light-dark(#e2e2e2,#2a2a2a);--soft:light-dark(#f4f4f4,#181818);--red:#e4002b}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;border-top:8px solid var(--ink);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1100px;margin:0 auto;padding:0 max(4vw,16px)}

/* login */
.login{max-width:400px;margin:0 auto;padding:clamp(40px,12vh,110px) 20px 40px}
.login h1{font-stretch:112%;font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1.05;margin:0 0 8px}
.login p{color:var(--mut);margin:0}
.login form{display:grid;gap:14px;margin-top:28px}
label{font-weight:600;font-size:15px;display:grid;gap:6px}
input{min-height:50px;font:16px Archivo,sans-serif;padding:0 14px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
input:focus{border-color:var(--ink);outline:none}
.btn{min-height:50px;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.55;cursor:wait}
.msg{min-height:24px;color:var(--red);font-weight:600;margin:0}

/* topo */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:64px;padding-top:8px;padding-bottom:8px}
.who{flex:1;line-height:1.2}
.who b{display:block;font-stretch:112%;font-weight:800;font-size:clamp(17px,4.5vw,22px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:13px;color:var(--mut)}
.ghost{min-height:44px;padding:0 14px;border:2px solid var(--ink);background:var(--bg);border-radius:22px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}

/* trilho geral */
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative;margin:26px 0 6px}
.track::before{content:"";position:absolute;left:10%;right:10%;top:54px;height:5px;background:var(--ink)}
.st{text-align:center;position:relative;padding:0 2px;cursor:pointer;background:none;border:0}
.st .n{font-stretch:112%;font-weight:800;font-size:clamp(28px,7vw,48px);line-height:1;display:block;height:46px}
.st .dot{width:24px;height:24px;border-radius:50%;background:var(--bg);border:5px solid var(--ink);margin:2px auto 8px;position:relative;z-index:1;display:block}
.st.has .dot{background:var(--ink)}.st.on .dot{background:var(--red);border-color:var(--red)}
.st .lb{font-size:13px;font-weight:600;display:block}

/* filtros */
.bar{display:flex;gap:8px;align-items:center;padding:16px 0 4px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border:2px solid var(--ink);background:var(--bg);border-radius:20px;font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.search{flex:1 1 200px;min-width:180px;min-height:40px;height:40px;border-radius:20px;font-size:16px}

/* cartões */
.case{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:16px 32px;padding:24px 0;border-bottom:1px solid var(--line)}
.area{font-size:13px;font-weight:600;color:var(--mut);margin:0 0 4px}
.case h2{font-size:21px;line-height:1.2;margin:0 0 4px;font-weight:600}
.parts{font-size:14px;color:var(--mut);margin:0 0 12px}
.numrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.num{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.copy{min-height:36px;padding:0 12px;border:1.5px solid var(--line);background:var(--soft);border-radius:18px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.copy.ok{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mini{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative;margin:0 0 12px;max-width:520px}
.mini::before{content:"";position:absolute;left:10%;right:10%;top:7px;height:3px;background:var(--line)}
.mini .fill{position:absolute;left:10%;top:7px;height:3px;background:var(--ink)}
.mini i{display:block;text-align:center;font-style:normal;font-size:12px;color:var(--mut);position:relative;line-height:1.2}
.mini i::before{content:"";display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 6px;background:var(--bg);border:3px solid var(--line);position:relative;z-index:1}
.mini i.done::before{background:var(--ink);border-color:var(--ink)}
.mini i.now{color:var(--ink);font-weight:600}.mini i.now::before{background:var(--red);border-color:var(--red)}
.status{font-weight:600;margin:0 0 10px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:10px;background:var(--ink);color:var(--bg);margin-left:6px;vertical-align:2px}
.link{font-size:14px;color:var(--ink);font-weight:600}
.obs{background:var(--soft);border-left:4px solid var(--red);border-radius:0 10px 10px 0;padding:14px 16px;align-self:start}
.obs h3{font-size:13px;font-weight:600;color:var(--mut);margin:0 0 6px}
.obs p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.obs.vazia{border-left-color:var(--line)}.obs.vazia p{color:var(--mut);font-size:14px}
.empty{padding:40px 0;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

@media(max-width:760px){
  .case{grid-template-columns:minmax(0,1fr);padding:20px 0}
  .case h2{font-size:19px}
}
@media(max-width:520px){
  .track{margin-top:20px}
  .track::before{top:40px;height:4px}
  .st .n{height:34px;font-size:28px}
  .st .dot{width:18px;height:18px;border-width:4px}
  .st .lb{font-size:11px}
  .mini i{font-size:0}
  .ghost{padding:0 12px}
}
@media(prefers-reduced-motion:no-preference){.mini .fill{transition:width .5s ease}}
</style>
</head>
<body>

<section class="login" id="vLogin">
  <h1>Acompanhamento de processos</h1>
  <p>Entre com seu usuário e senha.</p>
  <form id="fLogin" autocomplete="on">
    <label>Usuário<input id="usuario" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
    <label>Senha<input id="senha" name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn" id="bEntrar" type="submit">Entrar</button>
    <p class="msg" id="msg" role="alert"></p>
  </form>
</section>

<div id="vApp" hidden>
  <header class="top">
    <div class="wrap">
      <div class="who"><b id="nome"></b><span id="qtd"></span></div>
      <button class="ghost" id="bAtualizar" type="button">Atualizar</button>
      <button class="ghost" id="bSair" type="button">Sair</button>
    </div>
  </header>
  <main class="wrap">
    <div class="track" id="track"></div>
    <div class="bar">
      <button class="chip" data-f="all" aria-pressed="true">Todos</button>
      <button class="chip" data-f="open" aria-pressed="false">Em andamento</button>
      <button class="chip" data-f="closed" aria-pressed="false">Encerrados</button>
      <input type="search" class="search" id="q" placeholder="Buscar" aria-label="Buscar processos">
    </div>
    <div id="list"></div>
  </main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
{
const API_URL = 'https://script.google.com/macros/s/AKfycbzLz1EpViBa26WNoYC2eLWj6QhwcKEq-j70o-jHYsXJTsMz1sUV89ZNvTOB0F9itjbp/exec';

const ETAPAS=['Aberto','Citação','Defesa','Decisão','Encerrado'];
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const store={get(){try{return sessionStorage.getItem('tk')}catch(e){return null}},set(v){try{v?sessionStorage.setItem('tk',v):sessionStorage.removeItem('tk')}catch(e){}}};

async function api(body){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
  if(!r.ok) throw new Error('http '+r.status);
  return r.json();
}

let P=[],filtro='all',etapa=null,q='';

function mostrarLogin(texto){
  $('vApp').hidden=true;$('vLogin').hidden=false;$('msg').textContent=texto||'';
  $('bEntrar').disabled=false;$('bEntrar').textContent='Entrar';
}
function mostrarApp(d){
  P=d.processos||[];
  $('nome').textContent=d.cliente;
  $('qtd').textContent=P.length+(P.length===1?' processo':' processos')+' · atualizado '+d.consultadoEm;
  $('vLogin').hidden=true;$('vApp').hidden=false;
  draw();
}

const card=(p,idx)=>{
  const mini=ETAPAS.map((s,i)=>'<i class="'+(i<p.etapa?'done':'')+(i===p.etapa?' now':'')+'">'+esc(s)+'</i>').join('');
  let href=/^https:\/\//.test(p.link)?p.link:'#';
  if(href.includes('eproc-consulta.tjsp.jus.br')) href='https://eproc-consulta.tjsp.jus.br/consulta_1g/externo_controlador.php?acao=tjsp@consulta_unificada_publica/consultar&num_processo='+String(p.num).replace(/\D/g,'');
  const obs=String(p.obs||'').trim();
  return '<article class="case"><div>'+
    '<p class="area">'+esc(p.area)+(p.papel?' · você é parte '+esc(p.papel):'')+'</p>'+
    '<h2>'+esc(p.motivo)+'</h2><p class="parts">'+esc(p.autor)+' × '+esc(p.reu)+'</p>'+
    '<div class="numrow"><span class="num">'+esc(p.num)+'</span>'+
      '<button class="copy" type="button" data-i="'+idx+'" aria-label="Copiar número do processo '+esc(p.num)+'">Copiar nº</button></div>'+
    '<div class="mini"><span class="fill" style="width:'+(Number(p.etapa)*20)+'%"></span>'+mini+'</div>'+
    '<p class="status">'+esc(p.estado)+(p.favoravel?'<span class="tag">Favorável</span>':'')+'</p>'+
    '<a class="link" href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">Ver no site do tribunal</a>'+
  '</div>'+
  '<aside class="obs'+(obs?'':' vazia')+'"><h3>Observações</h3><p>'+(obs?esc(obs):'Sem observações no momento.')+'</p></aside>'+
  '</article>';
};
let visiveis=[];
function draw(){
  const t=q.toLowerCase();
  visiveis=P.filter(p=>(filtro==='all'||(filtro==='closed'?p.etapa===4:p.etapa<4))&&(etapa===null||p.etapa===etapa)&&
    (!t||[p.motivo,p.autor,p.reu,p.num,p.area,p.estado,p.obs].join(' ').toLowerCase().includes(t)));
  $('list').innerHTML=visiveis.length?visiveis.map(card).join(''):'<p class="empty">Nenhum processo encontrado.</p>';
  $('track').innerHTML=ETAPAS.map((s,i)=>{const n=P.filter(p=>p.etapa===i).length;
    return '<button class="st'+(n?' has':'')+(etapa===i?' on':'')+'" data-s="'+i+'" aria-pressed="'+(etapa===i)+'"><span class="n">'+n+'</span><span class="dot"></span><span class="lb">'+esc(s)+'</span></button>'}).join('');
}

let tt;
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1600)}
async function copiar(texto){
  try{await navigator.clipboard.writeText(texto);return true}catch(e){}
  try{const a=document.createElement('textarea');a.value=texto;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();a.setSelectionRange(0,texto.length);const ok=document.execCommand('copy');a.remove();return ok}catch(e){return false}
}
$('list').addEventListener('click',async e=>{
  const b=e.target.closest('.copy');if(!b)return;
  const p=visiveis[+b.dataset.i];if(!p)return;
  const ok=await copiar(p.num);
  if(ok){b.textContent='Copiado ✓';b.classList.add('ok');toast('Número copiado');setTimeout(()=>{b.textContent='Copiar nº';b.classList.remove('ok')},1800)}
  else toast('Não foi possível copiar');
});

$('fLogin').addEventListener('submit',async e=>{
  e.preventDefault();
  $('msg').textContent='';$('bEntrar').disabled=true;$('bEntrar').textContent='Entrando…';
  try{
    const d=await api({acao:'entrar',usuario:$('usuario').value,senha:$('senha').value});
    if(d.erro) return mostrarLogin(d.erro);
    store.set(d.token);$('senha').value='';mostrarApp(d);
  }catch(err){mostrarLogin('Não foi possível conectar. Verifique a internet e tente de novo.')}
});
async function atualizar(){
  const tk=store.get();if(!tk) return mostrarLogin();
  $('bAtualizar').disabled=true;$('bAtualizar').textContent='…';
  try{
    const d=await api({acao:'atualizar',token:tk});
    if(d.sessaoExpirada){store.set(null);return mostrarLogin('Sua sessão expirou. Entre de novo.')}
    if(d.erro) throw new Error(d.erro);
    mostrarApp(d);
  }catch(err){if($('vApp').hidden) mostrarLogin('Não foi possível conectar. Tente de novo.')}
  finally{$('bAtualizar').disabled=false;$('bAtualizar').textContent='Atualizar'}
}
$('bAtualizar').addEventListener('click',atualizar);
$('bSair').addEventListener('click',()=>{const tk=store.get();store.set(null);P=[];mostrarLogin();if(tk) api({acao:'sair',token:tk}).catch(()=>{})});
$('track').addEventListener('click',e=>{const b=e.target.closest('.st');if(!b)return;const i=+b.dataset.s;etapa=etapa===i?null:i;draw()});
document.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{filtro=b.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()}));
$('q').addEventListener('input',e=>{q=e.target.value;draw()});

if(store.get()) atualizar(); else mostrarLogin();
}
</script>
</body>
</html>
